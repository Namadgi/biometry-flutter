name: biometry
description: A Flutter package for integrating with the Biometry API to provide biometric authentication and verification services.
version: 1.0.10
homepage: https://biometrysolutions.com

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  audio_session: ^0.2.2
  camera: ^0.11.1
  camera_platform_interface: ^2.10.0
  device_info_plus: ^11.4.0
  flutter:
    sdk: flutter
  flutter_doc_scanner: ^0.0.18
  http: ^1.4.0
  http_parser: ^4.1.2
  path_provider: ^2.1.5
  recase: ^4.1.0
  speech_to_text: ^7.0.0
  uuid: ^4.5.1
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.6
  build_runner: ^2.4.15
  build_runner_core: ^8.0.0
  logging: ^1.3.0
  json_serializable: ^6.9.5
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
