name: biometry
description: A Flutter package for integrating with the Biometry API to provide biometric authentication and verification services.
version: 1.0.0
homepage: https://biometrysolutions.com

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  audio_session: ^0.1.25
  camera: ^0.11.1
  camera_platform_interface: ^2.9.0
  device_info_plus: ^11.3.3
  flutter:
    sdk: flutter
  flutter_doc_scanner: ^0.0.16
  http: ^1.3.0
  http_parser: ^4.1.2
  path_provider: ^2.1.5
  recase: ^4.1.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.5
  build_runner: ^2.4.15
  build_runner_core: ^8.0.0
  logging: ^1.3.0
  json_serializable: ^6.9.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
